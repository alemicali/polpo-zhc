<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Polpo — the octopus that wrangles AI agents into autonomous teams. Plans the work, checks the results, pokes you when it matters." />
    <!-- polpo:theme-color -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Polpo ZHC" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Satoshi — distinctive geometric sans with character (variable: every weight 300–900, so
         font-semibold is a real 600, not a synthesized one) -->
    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1&display=swap" rel="stylesheet" />
    <!-- The appearance font presets (lib/font-presets.ts): code, Redline / Claude headings, Inter.
         Declared only: the browser downloads a family when text on the page uses it. -->
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Inter:wght@400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400..700&display=swap" rel="stylesheet" />
    <!-- Classic script intentionally blocks the deferred application module so
         per-instance API settings are available before config.ts is evaluated. -->
    <script src="/runtime-config.js"></script>
    <!-- The look (theme, palette, custom tokens, theme-color) applied before the stylesheet paints:
         replaced at build time by the inline script from src/lib/appearance-kit.ts (vite.config.ts). -->
    <!-- polpo:appearance-boot -->
    <title>Polpo ZHC — AI Factory</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
