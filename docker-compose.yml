services:
  server:
    image: ${POLPO_SERVER_IMAGE:-ghcr.io/alemicali/polpo-zhc/server:latest}
    ports:
      - "${POLPO_SERVER_PORT:-3890}:3890"
    volumes:
      - "${POLPO_WORKSPACE:-./data/workspace}:/workspace"
    environment:
      NODE_ENV: production
      PORT: 3890
      POLPO_WORKDIR: /workspace
      POLPO_API_KEY: ${POLPO_API_KEY:-}
      POLPO_CORS_ORIGINS: ${POLPO_CORS_ORIGINS:-}
      POLPO_MODEL: ${POLPO_MODEL:-}
      POLPO_VAULT_KEY: ${POLPO_VAULT_KEY:-}
      POLPO_PUSH_VAPID_SUBJECT: ${POLPO_PUSH_VAPID_SUBJECT:-}
      DATABASE_URL: ${DATABASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      FAL_KEY: ${FAL_KEY:-}
      EXA_API_KEY: ${EXA_API_KEY:-}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
    restart: unless-stopped

  ui:
    image: ${POLPO_UI_IMAGE:-ghcr.io/alemicali/polpo-zhc/ui:latest}
    ports:
      - "${POLPO_UI_PORT:-3080}:80"
    environment:
      POLPO_API_UPSTREAM: http://server:3890
    depends_on:
      - server
    restart: unless-stopped
