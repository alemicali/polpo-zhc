name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck

  test:
    name: Test (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Tests import the workspace packages (@polpo-ai/core, drizzle, server, sdk…) from their dist.
      - run: pnpm run build:packages && pnpm --filter @polpo-ai/sdk build
      - run: pnpm run test run

  storage:
    name: Storage (SQLite + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: polpo
          POSTGRES_PASSWORD: polpo
          POSTGRES_DB: polpo_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U polpo"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:packages
      # Migrations must match the schema: regenerating them must change nothing.
      - name: Migrations up to date
        run: |
          pnpm --filter @polpo-ai/drizzle exec drizzle-kit generate --config drizzle.pg.config.ts
          pnpm --filter @polpo-ai/drizzle exec drizzle-kit generate --config drizzle.sqlite.config.ts
          if [ -n "$(git status --porcelain packages/drizzle/migrations)" ]; then
            git status --porcelain packages/drizzle/migrations
            echo "::error::Schema changed without a migration: run pnpm --filter @polpo-ai/drizzle db:generate"
            exit 1
          fi
      - run: pnpm --filter @polpo-ai/drizzle test
        env:
          POLPO_TEST_DATABASE_URL: postgres://polpo:polpo@localhost:5432/polpo_test

  install-check:
    name: Install Check
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack
      - name: Verify npm install from tarball
        run: |
          mkdir /tmp/install-test && cd /tmp/install-test
          npm init -y
          npm install $GITHUB_WORKSPACE/polpo-ai-*.tgz
          node --input-type=module -e "import 'polpo-ai'"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run --filter @polpo-ai/sdk build
      - run: pnpm run --filter @polpo-ai/react build
      - run: pnpm run --filter ui build
